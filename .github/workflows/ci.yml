name: CI

# StoryLoop 引擎自己的 CI：全量测试（Linux 与 Windows，全部必须通过）、字节码编译、密钥扫描。
# Python 统一用 3.11：pyproject 声明的最低版本，也是本地开发版本；两个系统只差操作系统。
# 只改文档时跳过测试，密钥扫描照常运行。
# 引擎只用标准库，没有依赖安装步骤；测试会创建临时 Git 仓库，所以需要 git 身份。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR 上新推送会取消旧运行；main 上每次合并都要跑完，留下完整记录。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: 改动范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 判断是否只改了文档
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # 文档：docs/ 下任意文件、LICENSE、storyloop/ 与 tests/ 以外的 .md。
        # storyloop/ 下的 .md 是随包发布的技能包，tests/ 下的 .md 是测试夹具，都按代码处理。
        # 手动触发、取不到对比基点或 diff 失败时一律按代码处理。
        run: |
          code=false
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            code=true
          elif ! files=$(git diff --name-only "$BASE...$HEAD") || [ -z "$files" ]; then
            code=true
          else
            printf '%s\n' "$files"
            while IFS= read -r f; do
              case "$f" in
                storyloop/*|tests/*) code=true ;;
                docs/*|LICENSE|*.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  tests:
    name: 测试（${{ matrix.os }}）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Git 身份（测试会提交到临时仓库）
        run: |
          git config --global user.email "ci@storyloop.invalid"
          git config --global user.name "StoryLoop CI"
          git config --global init.defaultBranch main
      - name: 编译检查
        run: python -m compileall -q storyloop examples/claude-code
      - name: 安装（确认打包配置与技能包数据完整）
        run: python -m pip install --quiet .
      - name: 全量测试
        run: python -m unittest discover -s tests -t .

  security:
    name: 密钥扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 gitleaks（固定版本，校验摘要）
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # 扫描本次引入的每个提交，中途加入又删掉的密钥也会被发现（公开仓库的历史删不掉）。
        # 手动触发或取不到对比基点时扫描全部历史。
        run: |
          if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            set -- --log-opts="$BASE..$HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1 "$@"

  # 分支规则只要求这一项：跳过的作业算通过，失败或取消算不通过。
  result:
    name: CI 结果
    if: always()
    needs: [changes, tests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
