[invariants.I1]
title = "判定只来自引擎在受控进程中观察到的退出码和指纹，代理文字不构成证据"
status = "guarded"
tests = ["tests.test_change_report::test_failed_or_unmapped_acceptance_cannot_produce_pass_report", "tests.test_smoke::test_isolated_smoke_cannot_modify_the_candidate_to_make_itself_pass", "tests.test_invariants::test_i1_pass_claims_cannot_override_observed_exit_status"]

[invariants.I2]
title = "合同在批准时锁定指纹，任何修订都让批准失效"
status = "guarded"
tests = ["tests.test_change_approval::test_revision_invalidates_an_existing_approval"]

[invariants.I3]
title = "判据受字节保护，实现者写入即越界"
status = "guarded"
tests = ["tests.test_project_boundaries::test_ci_and_committed_acceptance_contracts_are_never_implementation_outputs"]

[invariants.I4]
title = "只有候选副本中退出码为 1 的行为失败才是有效 RED"
status = "guarded"
tests = ["tests.test_ci_runner::test_red_requires_a_real_behavioral_failure_and_tampering_blocks", "tests.test_invariants::test_i4_environment_exit_and_timeout_cannot_prove_red", "tests.test_invariants::test_i4_zero_execution_and_skipping_cannot_prove_red"]

[invariants.I5]
title = "每轮尝试后都做全树边界审计"
status = "guarded"
tests = ["tests.test_project_loop_tampering::test_implementation_cannot_modify_ignored_control_plane"]

[invariants.I6]
title = "证据和人工验收绑定实现指纹，代码变了就失效"
status = "guarded"
tests = ["tests.test_project_loop_tampering::test_review_cannot_change_code_after_green_evidence", "tests.test_invariants::test_i6_a_byte_change_invalidates_manual_acceptance"]

[invariants.I7]
title = "判据自证：执行数不为 0、不比基线骤降；新检查先在注入违规上跑红"
status = "guarded"
tests = ["tests.test_invariants::test_i7_a_green_layer_that_executed_nothing_fails", "tests.test_invariants::test_i7_fewer_tests_than_the_baseline_floor_fails"]

[invariants.I8]
title = "完成阶段幂等，每一步状态先落盘"
status = "guarded"
tests = ["tests.test_completion_resilience::test_completion_resumes_after_a_crash_following_the_implementation_commit"]

[invariants.I9]
title = "不 push、不改写历史，只提交显式路径"
status = "guarded"
tests = ["tests.test_invariants::test_i9_the_engine_has_no_push_or_history_rewrite"]

[invariants.I10]
title = "角色按权限划分"
status = "guarded"
tests = ["tests.test_workspace_scratch::test_staging_files_is_never_tolerated", "tests.test_project_security_gates::test_git_ignored_runtime_dependency_is_tainted", "tests.test_project_loop_tampering::test_review_cannot_change_tracked_code_in_a_cache_named_directory"]

[invariants.I11]
title = "只升不降：档位在运行中只能升级，且不低于类型的最低档位"
status = "guarded"
tests = ["tests.test_invariants::test_i11_a_lighter_decision_never_lowers_the_effective_tier", "tests.test_change_types::test_run_cannot_open_below_the_type_floor"]

[invariants.I12]
title = "底线单调：状态迁移只经守卫，守卫读取类型底线；阶段只能加严"
status = "guarded"
tests = ["tests.test_lifecycle_architecture::test_run_status_writes_have_one_owner", "tests.test_lifecycle_guards::test_real_completion_cannot_skip_a_configured_unit_layer", "tests.test_lifecycle_guards::test_g1_rejects_a_type_without_a_supported_red_floor", "tests.test_lifecycle_guards::test_g2_reads_the_type_writable_scope"]

[invariants.I13]
title = "底座只能被 base 类型的变更推进，也只有 base 类型能写底座"
status = "pending"
stage = "E"

[invariants.I14]
title = "依赖只能向下，底座不导入可变区"
status = "guarded"
tests = ["tests.test_architecture::test_no_unexempted_violations", "tests.test_architecture::test_no_new_module_joins_a_cycle"]

[invariants.I15]
title = "判定者与被判定者分离"
status = "pending"
stage = "T6"
